[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cayoftorre-ciband"
version = "0.1.0"
description = "按分数类型选择合适区间算法，输出点估计与区间宽度"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cayoftorre" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cayoftorre.github.io"
Repository = "https://github.com/cayoftorre/ciband"
Issues = "https://github.com/cayoftorre/ciband/issues"

[project.scripts]
ciband = "ciband:main"

[tool.setuptools]
py-modules = ["ciband"]
